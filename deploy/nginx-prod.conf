server {
    listen 80;
    server_name trainers.onenessyoga.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trainers.onenessyoga.in;

    ssl_certificate     /etc/letsencrypt/live/trainers.onenessyoga.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainers.onenessyoga.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/oneness-yoga/prod/frontend/dist;
    index index.html;

    # API proxy to the prod Node.js backend (PM2: oneness-yoga-prod-api)
    # proxy_read_timeout raised above nginx's 60s default - the AI weekly
    # scheduler's own OpenRouter call/retry can take up to ~120s worst case
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # React SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
